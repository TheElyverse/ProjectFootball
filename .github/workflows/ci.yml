name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      # The hosted runners have four cores; ctest runs one test at a time
      # unless told otherwise.
      CTEST_PARALLEL_LEVEL: 4
    steps:
      - uses: actions/checkout@v7

      # Object files carried over from earlier runs: third-party code and
      # unchanged sources are not compiled again.
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.os }}-ci

      # Ninja, unlike the Visual Studio generator, expects the compiler
      # environment to be set up already.
      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -products * -property installationPath
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && set" | ForEach-Object {
            $name, $value = $_ -split '=', 2
            if ($value -ne [Environment]::GetEnvironmentVariable($name)) {
              "$name=$value" >> $env:GITHUB_ENV
            }
          }
          "CXX=cl" >> $env:GITHUB_ENV

      # ccache cannot cache MSVC objects whose debug information goes to a
      # shared PDB file (/Zi), so it is embedded in each object (/Z7).
      - name: Configure
        run: cmake --preset ci -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded

      - name: Build
        run: cmake --build --preset ci

      - name: Test
        run: ctest --preset ci --label-exclude acceptance

      # Whole-match scenarios: stability over minutes of simulated time,
      # identical hashes on repeated runs, replay playback and batch sizes,
      # and pinned state hashes that must match on every platform.
      - name: Acceptance scenarios
        run: ctest --preset ci --label-regex acceptance --output-on-failure

    # P2 acceptance, reduced: the three tactical identities in a round robin,
  # in a Release build within its time budget (docs/sim-benchmark.md).
  style-benchmark:
    runs-on: ubuntu-latest
    env:
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v7

      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ubuntu-latest-ci-release

      - name: Configure
        run: cmake --preset ci-release

      - name: Build
        run: cmake --build --preset ci-release --target sim-benchmark

      - name: Style benchmark
        run: ctest --preset ci-release --label-regex benchmark --output-on-failure

  # The web debug viewer (apps/sim-viewer): type-check, build and unit tests.
  viewer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/sim-viewer
    steps:
      - uses: actions/checkout@v7

      # The pnpm version comes from the package's packageManager field, so CI
      # and a local install run the same one.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/sim-viewer/package.json

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/sim-viewer/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build and test
        run: pnpm test

  # The static website (apps/website): Tailwind build of the landing page.
  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/website
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/website/package.json

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/website/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

  # The manager UI (apps/manager-ui): type-check and Vite build of the page Unreal shows.
  manager-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/manager-ui
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/manager-ui/package.json

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/manager-ui/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check formatting
        run: |
          find libs apps tests -name '*.hpp' -o -name '*.cpp' \
            | xargs clang-format --dry-run --Werror

  lint:
    runs-on: ubuntu-latest
    steps:
      # Two commits deep: a pull request is checked out as its merge commit,
      # whose first parent is the base branch.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # clang-tidy-18 (the version bundled with ubuntu-latest) reports
      # __cpp_concepts as 201907L instead of 202002L, so libstdc++'s <expected>
      # header self-disables under it (guarded on __cpp_concepts >= 202002L) --
      # unrelated to libstdc++ version. Fixed in Clang 19; install it from the
      # official LLVM repo instead of relying on the distro package.
      - name: Install clang-tidy-19
        # Review the installer before updating either pin. The checksum must pass
        # before any downloaded code is executed with elevated privileges.
        env:
          LLVM_INSTALLER_REV: c5ecff7c7208c8b5225e1f6e6ae6f2539e1d31ea
          LLVM_INSTALLER_SHA256: 03878e08f47b66cc95bc4b544b0db3c6d9ce8d60e6cf2492ae357984330a9eae
        shell: bash
        run: |
          installer="${RUNNER_TEMP}/llvm.sh"
          wget -q "https://raw.githubusercontent.com/opencollab/llvm-jenkins.debian.net/${LLVM_INSTALLER_REV}/llvm.sh" -O "$installer"
          printf '%s  %s\n' "$LLVM_INSTALLER_SHA256" "$installer" | sha256sum --check --strict
          chmod +x "$installer"
          sudo "$installer" 19
          sudo apt-get install -y clang-tidy-19

      - name: Configure
        run: cmake --preset ci

      # A pull request checks the sources it changes, and for a changed header
      # the sources that include it; a push to main checks everything, and so
      # does a pull request that changes the lint or build configuration.
      - name: Run clang-tidy
        run: |
          sources() { find libs apps tests -name '*.cpp'; }
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            changed=$(git diff --name-only --diff-filter=d HEAD^1 HEAD)
            if ! grep -qE '(^|/)(\.clang-tidy|CMakeLists\.txt|CMakePresets\.json|ci\.yml)$|^cmake/' <<< "$changed"; then
              headers=$(grep -E '^(libs|apps|tests)/.*\.hpp$' <<< "$changed" | xargs -r -n1 basename || true)
              files=$({
                grep -E '^(libs|apps|tests)/.*\.cpp$' <<< "$changed" || true
                for header in $headers; do
                  sources | xargs grep -lF "\"$header\"" || true
                done
              } | sort -u)
            fi
          fi
          echo "${files-$(sources)}" | xargs -r run-clang-tidy-19 -quiet -p build/ci

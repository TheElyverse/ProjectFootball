name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: cmake --preset ci

      - name: Build
        run: cmake --build --preset ci

      - name: Test
        run: ctest --preset ci --label-exclude acceptance

      # Whole-match scenarios: stability over minutes of simulated time,
      # identical hashes on repeated runs, replay playback and batch sizes,
      # and pinned state hashes that must match on every platform.
      - name: Acceptance scenarios
        run: ctest --preset ci --label-regex acceptance --output-on-failure

  # The web debug viewer (apps/sim-viewer): type-check, build and unit tests.
  viewer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/sim-viewer
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      # No lockfile: typescript, the only dependency, is pinned exactly.
      - name: Install
        run: npm install --no-audit --no-fund

      - name: Build and test
        run: npm test

  # The static website (apps/website): Tailwind build of the landing page.
  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/website
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check formatting
        run: |
          find libs apps tests -name '*.hpp' -o -name '*.cpp' \
            | xargs clang-format --dry-run --Werror

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # clang-tidy-18 (the version bundled with ubuntu-latest) reports
      # __cpp_concepts as 201907L instead of 202002L, so libstdc++'s <expected>
      # header self-disables under it (guarded on __cpp_concepts >= 202002L) --
      # unrelated to libstdc++ version. Fixed in Clang 19; install it from the
      # official LLVM repo instead of relying on the distro package.
      - name: Install clang-tidy-19
        # Review the installer before updating either pin. The checksum must pass
        # before any downloaded code is executed with elevated privileges.
        env:
          LLVM_INSTALLER_REV: c5ecff7c7208c8b5225e1f6e6ae6f2539e1d31ea
          LLVM_INSTALLER_SHA256: 03878e08f47b66cc95bc4b544b0db3c6d9ce8d60e6cf2492ae357984330a9eae
        shell: bash
        run: |
          installer="${RUNNER_TEMP}/llvm.sh"
          wget -q "https://raw.githubusercontent.com/opencollab/llvm-jenkins.debian.net/${LLVM_INSTALLER_REV}/llvm.sh" -O "$installer"
          printf '%s  %s\n' "$LLVM_INSTALLER_SHA256" "$installer" | sha256sum --check --strict
          chmod +x "$installer"
          sudo "$installer" 19
          sudo apt-get install -y clang-tidy-19

      - name: Configure
        run: cmake --preset ci

      - name: Run clang-tidy
        run: |
          find libs apps tests -name '*.hpp' -o -name '*.cpp' \
            | xargs run-clang-tidy-19 -quiet -p build/ci
